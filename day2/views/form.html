<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  </head>
  <body>
    <div class="container">
      <h1>Registration Form</h1>
      <form method="post" action="../main.php">
      <label class="form-label" for="first name">First Name:</label>
      <input class="form-control" type="text" id="first name" name="first_name" />
      <br />
      <br />
      <label class="form-label" for="last name">Last Name:</label>
      <input class="form-control" type="text" id="last name" name="last_name" />
      <br />
      <br />
      <label class="form-label" for="address">Address:</label>
      <textarea class="form-control" name="address" id="address"></textarea>
      <br />
      <br />
      <label class="form-label" for="country">Country:</label>
      <select class="form-control" name="country" id="country">
        <option value="us">United States</option>
        <option value="ca">Canada</option>
        <option value="uk">United Kingdom</option>
      </select>
      <br />
      <br />
      <label class="form-label" for="gender">Gender:</label>
      <input class="form-check-input" type="radio" name="gender" id="gender" value="male" />
      <label class="form-check-label" for="gender">Male</label>
      <input class="form-check-input" type="radio" name="gender" id="gender" value="female" />
      <label class="form-check-label" for="gender">Female</label>
      <br />
      <br />
      <label class="form-label" for="skills">Skills:</label>
      <br />
      <input class="form-check-input" type="checkbox" name="skills[]" id="skills" value="php" />
      <label class="form-check-label" for="skills">PHP</label>
      <input
        class="form-check-input"
        type="checkbox"
        name="skills[]"
        id="skills"
        value="javascript"
      />
      <label class="form-check-label" for="skills">JavaScript</label>
      <input class="form-check-input" type="checkbox" name="skills[]" id="skills" value="python" />
      <label class="form-check-label" for="skills">Python</label>
      <br />
      <br />
      <label class="form-label" for="email">Email:</label>
      <input class="form-control" type="email" id="email" name="email" />
      <br />
      <br />
      <label class="form-label" for="password">Password:</label>
      <input class="form-control" type="password" id="password" name="password" />
      <br />
      <br />
      <label class="form-label" for="department">Department:</label>
      <input class="form-control" type="text" name="department" placeholder="OpenSource" />
      <br />
      <br />
      <label class="form-label" for="confirm">abcdef</label>
      <br />
      <input class="form-control" type="text" name="confirm" id="confirm" />
      <label class="form-label" for="confirm">please enter the code above to submit:</label>
      <br />
      <br />
      <button class="btn btn-primary" type="submit" id="submit" disabled>Submit</button>
      <button class="btn btn-secondary" type="reset">Reset</button>
    </form>
    </div>

    <script>
      const confirmInput = document.getElementById("confirm");
      const button = document.getElementById("submit");

      const code = "abcdef";

      confirmInput.addEventListener("input", function () {
        if (confirmInput.value === code) {
          button.disabled = false;
        } else {
          button.disabled = true;
        }
      });
    </script>
  </body>
</html>
